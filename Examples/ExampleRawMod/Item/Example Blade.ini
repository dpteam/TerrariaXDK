; A new item, declared without compiling anything.
;
; type=-1 is the tConfig marker for "this is not a tweak, it is a new item". Everything else is
; a field of the item: the same names a compiled mod uses (Context.DefineItem(...).Damage = 12).
; Unsupported names are reported in the log instead of being ignored.
type=-1
damage=14
useAnimation=20
useTime=20
knockBack=3.5
useSound=1
useStyle=1
scale=1
width=16
height=16
value=500
rare=0
autoReuse=false
melee=true
isMaterial=false
toolTip=An example of a raw mod

; The recipe lives in the same file, in its own sections.
; Unknown station names are dropped with a note rather than cancelling the recipe.
[Items]
Copper Bar=6
Wood=2
[Tiles]
Work Bench=true
[Amount]
1
